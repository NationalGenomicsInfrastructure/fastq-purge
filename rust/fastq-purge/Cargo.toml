[package]
name = "fastq-purge"
version = "0.3.0"
edition = "2021"
description = "Purge FASTQ files of reads already present in assigned files (Rust rewrite, see RUST_REWRITE.md)"
license = "MIT"

[[bin]]
name = "fastq-purge-rs"
path = "src/main.rs"

[[bin]]
name = "fastq-dump"
path = "src/bin/fastq-dump.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
xxhash-rust = { version = "0.8", features = ["xxh64"] }

[profile.release]
lto = true